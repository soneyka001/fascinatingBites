name: Auto Post Instagram Reels

on:
  schedule:
    # Runs at minute 0 of every hour (UTC time)
    - cron: '0 * * * *'
  workflow_dispatch: # Allows manual trigger from the GitHub Actions tab for testing

jobs:
  run-poster:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install instagrapi google-api-python-client google-auth google-auth-httplib2 google-auth-oauthlib

      - name: Create service account key file
        run: |
          echo "$GCP_SERVICE_ACCOUNT_KEY" > service_account.json
        env:
          GCP_SERVICE_ACCOUNT_KEY: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}

      - name: Restore Instagram session cache
        run: |
          if [ -n "$IG_SESSION_DATA" ]; then
            echo "$IG_SESSION_DATA" > session.json
          fi
        env:
          IG_SESSION_DATA: ${{ secrets.IG_SESSION_DATA }}

      - name: Execute post script
        env:
          IG_USERNAME: ${{ secrets.IG_USERNAME }}
          IG_PASSWORD: ${{ secrets.IG_PASSWORD }}
        run: python post_reels.py

      - name: Clean up temporary credentials
        if: always()
        run: rm -f service_account.json
